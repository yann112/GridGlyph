model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  lora_r: 64
  lora_alpha: 128
  use_4bit: true

training:
  batch_size: 1
  grad_accum: 16
  learning_rate: 0.00005
  max_steps: 5000
  fp16: true
  gradient_checkpointing: true
  push_to_hub: true
  save_steps: 500         # Sauvegarde automatique tous les 500 pas
  hub_strategy: "every_save" # Envoie sur HF à chaque sauvegarde
  save_total_limit: 2    # Garde seulement les 2 derniers pour ne pas saturer HF

repo:
  seeds: "yannumber1/gridglyph-atomic-seeds"
  output: "yannumber1/qwen-0.5b-gridglyph-atomic"