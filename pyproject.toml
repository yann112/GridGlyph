[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridglyph"
version = "0.1.0"
description = "Neuro-symbolic engine for ARC puzzles"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "numpy",
    "transformers",
    "peft",
    "datasets",      # Plural version for HF
    "bitsandbytes",
    "accelerate",
    "huggingface_hub",
    "pyyaml",         # Required for your config files
    "python-dotenv",
    "opencv-python",
    "pillow",
    "requests",
    "pytest",
    "tiktoken",
     "sentencepiece"
]

[project.scripts]
gridglyph-train = "gridglyph.trainer.train:start_fine_tuning"
gridglyph-predict = "gridglyph.predictor.predict:main"
gridglyph-build = "gridglyph.__main__:main"

[tool.setuptools]
packages = { find = { where = ["."], include = ["gridglyph*"] } }